<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AI Coding Summit — London</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="reveal-base-theme" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <section class="stage-1 slide-splash" data-transition="fade">
        <span class="eyebrow">London · 2026</span>
        <h1>AI Coding Summit</h1>
        <p class="subtitle">A trip report — in the room, and async</p>
      </section>

      <section class="stage-1 slide-content">
        <h2>Placeholder</h2>
        <p>Stage/typography system is locked — talk slides coming next.</p>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      transition: 'slide',
      transitionSpeed: 'default',
      backgroundTransition: 'fade',
      controls: true,
      progress: true,
      center: false,
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });

    // Controls/progress bar color tracks the active slide's stage (see
    // theme.css .reveal .controls / .progress reading --accent), since they
    // sit outside .slides and don't inherit a stage class from the section.
    const revealEl = document.querySelector('.reveal');
    function syncStageClass(slide) {
      const stageClass = [...slide.classList].find((c) => c.startsWith('stage-'));
      revealEl.className = revealEl.className.replace(/\bstage-\d+\b/g, '').trim();
      if (stageClass) revealEl.classList.add(stageClass);
    }
    Reveal.on('slidechanged', (event) => syncStageClass(event.currentSlide));
    Reveal.on('ready', (event) => syncStageClass(event.currentSlide));
  </script>
</body>
</html>
